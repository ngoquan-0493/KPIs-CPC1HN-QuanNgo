[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Ghim phien ban @netlify/plugin-nextjs ve 5.15.12 (thay vi de Netlify tu
# dong lay ban moi nhat) vi ban 5.15.13 co bug bundling function bi thieu
# file "handlers/request-context.cjs", khien function server crash sau khi
# deploy (khong lien quan Next.js 15 hay 16, ca hai deu bi loi giong nhau
# voi 5.15.13). Xem: https://docs.netlify.com/frameworks/next-js/overview/#reverting-to-an-older-adapter-version
[[plugins]]
  package = "@netlify/plugin-nextjs"
